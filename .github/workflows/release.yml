name: Release & Packaging Pipeline

on:
  pull_request:
    types: [closed]
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Nom de la version / Tag (ex: v1.1.0)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: read

jobs:
  prepare-release:
    name: Prepare Version & Tag
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Calculate Version & Tag
        id: calc
        shell: bash
        run: |
          set -e

          # 1. Priorité tag explicite via push de tag ou workflow_dispatch
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            VERSION="${TAG#v}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            # 2. Détection de version lors de la fusion d'une PR sur main
            PR_TITLE="${{ github.event.pull_request.title }}"
            if echo "$PR_TITLE" | grep -oPE 'v?[0-9]+\.[0-9]+\.[0-9]+' >/dev/null; then
              VERSION=$(echo "$PR_TITLE" | grep -oPE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            else
              CUR_VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" Directory.Build.props 2>/dev/null || echo "1.1.0")
              IFS='.' read -r MAJOR MINOR PATCH <<< "$CUR_VERSION"
              MAJOR=${MAJOR:-1}
              MINOR=${MINOR:-1}
              PATCH=${PATCH:-0}

              LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
              if [ -n "$LAST_TAG" ]; then
                COMMITS_LOG=$(git log "$LAST_TAG..HEAD" --oneline 2>/dev/null || echo "")
              else
                COMMITS_LOG=$(git log -n 50 --oneline 2>/dev/null || echo "")
              fi

              if echo "$COMMITS_LOG" | grep -iE "(BREAKING CHANGE|!:)"; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
              elif echo "$COMMITS_LOG" | grep -iE "^[a-f0-9]+ feat"; then
                MINOR=$((MINOR + 1))
                PATCH=0
              else
                PATCH=$((PATCH + 1))
              fi
              VERSION="$MAJOR.$MINOR.$PATCH"
            fi
            TAG="v$VERSION"

            chmod +x packaging/bump-version.sh
            ./packaging/bump-version.sh "$VERSION"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Directory.Build.props
            if ! git diff --cached --quiet; then
              git commit -m "chore(release): $TAG [skip ci]"
              git push origin main
            fi
            git tag "$TAG"
            git push origin "$TAG"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release retenue : $VERSION ($TAG)"

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Codecs (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 libgomp1 libatomic1 libgtk-3-0t64 || sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 libgomp1 libatomic1 libgtk-3-0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore CassiniFlow.slnx

      - name: Build solution (Release)
        run: dotnet build CassiniFlow.slnx -c Release --no-restore

      - name: Run unit tests
        run: dotnet test CassiniFlow.slnx -c Release --no-build --verbosity normal

  package-binaries:
    name: Package Binaries (${{ matrix.target.name }})
    needs: [prepare-release, build-and-test]
    runs-on: ${{ matrix.target.os }}
    strategy:
      matrix:
        target:
          - name: win-x64
            os: windows-latest
            rid: win-x64
          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Desktop (Self-Contained)
        run: >
          dotnet publish src/CassiniFlow.Desktop/CassiniFlow.Desktop.csproj
          -c Release
          -r ${{ matrix.target.rid }}
          --self-contained true
          -o staging/${{ matrix.target.name }}/Desktop

      - name: Publish CLI (Self-Contained)
        run: >
          dotnet publish src/CassiniFlow.Cli/CassiniFlow.Cli.csproj
          -c Release
          -r ${{ matrix.target.rid }}
          --self-contained true
          -o staging/${{ matrix.target.name }}/Cli

      - name: Copy Documentation
        shell: bash
        run: |
          cp README.md staging/${{ matrix.target.name }}/ || true
          cp LICENSE staging/${{ matrix.target.name }}/ || true
          mkdir -p release-artifacts

      # Windows Specific: Portable ZIP + Inno Setup Installer
      - name: Build Windows Packages (Portable & Installer)
        if: matrix.target.name == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "staging/win-x64/Desktop/Assets" -Force | Out-Null
          Copy-Item "src/CassiniFlow.Desktop/Assets/cassiniflow.ico" -Destination "staging/win-x64/Desktop/Assets/cassiniflow.ico" -Force

          # 1. Portable ZIP
          Compress-Archive -Path "staging/win-x64/*" -DestinationPath "release-artifacts/CassiniFlow-win-x64-portable.zip" -Force
          
          # 2. Inno Setup Compiler
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc "/DMyAppVersion=${{ needs.prepare-release.outputs.version }}" packaging/windows/CassiniFlow.iss

      # Linux Specific: Portable TAR.GZ + Debian (.deb) Package
      - name: Build Linux Packages (Portable & Installer)
        if: matrix.target.name == 'linux-x64'
        shell: bash
        run: |
          cp packaging/linux/install.sh staging/linux-x64/
          cp packaging/linux/uninstall.sh staging/linux-x64/
          cp packaging/linux/cassiniflow.desktop staging/linux-x64/
          cp src/CassiniFlow.Desktop/Assets/icon_256x256.png staging/linux-x64/
          chmod +x staging/linux-x64/install.sh staging/linux-x64/uninstall.sh staging/linux-x64/Desktop/CassiniFlow.Desktop staging/linux-x64/Cli/CassiniFlow.Cli
          
          # 1. Portable TAR.GZ
          tar -czf "release-artifacts/CassiniFlow-linux-x64-portable.tar.gz" -C staging/linux-x64 .
          
          # 2. Debian Package (.deb)
          chmod +x packaging/linux/build-deb.sh
          ./packaging/linux/build-deb.sh "${{ needs.prepare-release.outputs.version }}"

      - name: Upload Packaged Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target.name }}
          path: release-artifacts/*

  publish-github-release:
    name: Publish GitHub Release
    needs: [prepare-release, package-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: CassiniFlow ${{ needs.prepare-release.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.exe
            release-artifacts/*.zip
            release-artifacts/*.tar.gz
            release-artifacts/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
