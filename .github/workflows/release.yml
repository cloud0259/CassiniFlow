name: Release & Packaging Pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Nom de la version / Tag (ex: v1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Codecs (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 libgomp1 libgtk-3-0t64 || sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 libgomp1 libgtk-3-0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore CassiniFlow.slnx

      - name: Build solution (Release)
        run: dotnet build CassiniFlow.slnx -c Release --no-restore

      - name: Run unit tests
        run: dotnet test CassiniFlow.slnx -c Release --no-build --verbosity normal

  package-binaries:
    name: Package Binaries (${{ matrix.target.name }})
    needs: build-and-test
    runs-on: ${{ matrix.target.os }}
    strategy:
      matrix:
        target:
          - name: win-x64
            os: windows-latest
            rid: win-x64
          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            V="${{ github.event.inputs.tag_name }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            V="${GITHUB_REF#refs/tags/}"
          else
            V="1.0.0"
          fi
          V_CLEAN="${V#v}"
          echo "version=$V_CLEAN" >> "$GITHUB_OUTPUT"
          echo "Building package version: $V_CLEAN"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Desktop (Self-Contained)
        run: >
          dotnet publish src/CassiniFlow.Desktop/CassiniFlow.Desktop.csproj
          -c Release
          -r ${{ matrix.target.rid }}
          --self-contained true
          -o staging/${{ matrix.target.name }}/Desktop

      - name: Publish CLI (Self-Contained)
        run: >
          dotnet publish src/CassiniFlow.Cli/CassiniFlow.Cli.csproj
          -c Release
          -r ${{ matrix.target.rid }}
          --self-contained true
          -o staging/${{ matrix.target.name }}/Cli

      - name: Copy Documentation
        shell: bash
        run: |
          cp README.md staging/${{ matrix.target.name }}/ || true
          cp LICENSE staging/${{ matrix.target.name }}/ || true
          mkdir -p release-artifacts

      # Windows Specific: Portable ZIP + Inno Setup Installer
      - name: Build Windows Packages (Portable & Installer)
        if: matrix.target.name == 'win-x64'
        shell: pwsh
        run: |
          # 1. Portable ZIP
          Compress-Archive -Path "staging/win-x64/*" -DestinationPath "release-artifacts/CassiniFlow-win-x64-portable.zip" -Force
          
          # 2. Inno Setup Compiler
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" packaging/windows/CassiniFlow.iss

      # Linux Specific: Portable TAR.GZ + Debian (.deb) Package
      - name: Build Linux Packages (Portable & Installer)
        if: matrix.target.name == 'linux-x64'
        shell: bash
        run: |
          # Prepare Portable Linux Staging
          cp packaging/linux/install.sh staging/linux-x64/
          cp packaging/linux/uninstall.sh staging/linux-x64/
          cp packaging/linux/cassiniflow.desktop staging/linux-x64/
          cp src/CassiniFlow.Desktop/Assets/icon_256x256.png staging/linux-x64/
          chmod +x staging/linux-x64/install.sh staging/linux-x64/uninstall.sh staging/linux-x64/Desktop/CassiniFlow.Desktop staging/linux-x64/Cli/CassiniFlow.Cli
          
          # 1. Portable TAR.GZ
          tar -czf "release-artifacts/CassiniFlow-linux-x64-portable.tar.gz" -C staging/linux-x64 .
          
          # 2. Debian Package (.deb)
          chmod +x packaging/linux/build-deb.sh
          ./packaging/linux/build-deb.sh "${{ steps.version.outputs.version }}"

      - name: Upload Packaged Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target.name }}
          path: release-artifacts/*

  publish-github-release:
    name: Publish GitHub Release
    needs: package-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(date +'%Y.%m.%d-%H%M')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: CassiniFlow ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.exe
            release-artifacts/*.zip
            release-artifacts/*.tar.gz
            release-artifacts/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
